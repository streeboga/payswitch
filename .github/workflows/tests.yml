name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            widget/package-lock.json
            dashboard/package-lock.json

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install & Build Widget
        run: npm --prefix widget ci && npm --prefix widget run build

      - name: Install Node Dependencies
        run: npm --prefix dashboard ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm --prefix dashboard run build

      - name: Tests
        run: ./vendor/bin/pest

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            widget/package-lock.json
            dashboard/package-lock.json

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('dashboard/package-lock.json') }}

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install & Build Widget
        run: npm --prefix widget ci && npm --prefix widget run build

      - name: Install Node Dependencies
        run: npm --prefix dashboard ci

      - name: Install Playwright Browsers
        run: npx --prefix dashboard playwright install --with-deps chromium

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Database
        run: |
          touch database/database.sqlite
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      - name: Seed Test Data
        run: php artisan db:seed --class=TestSeeder --force
        env:
          DB_CONNECTION: sqlite

      - name: Build Frontend
        run: npm --prefix dashboard run build
        env:
          VITE_BACKEND_URL: http://localhost:8000

      - name: Start Laravel Server
        run: php artisan serve --port=8000 &
        env:
          DB_CONNECTION: sqlite

      - name: Start Vite Preview
        run: npm --prefix dashboard run preview -- --port 3000 &

      - name: Wait for servers
        run: npx wait-on http://localhost:8000/up http://localhost:3000 --timeout 30000

      - name: Run E2E Tests
        run: npm --prefix dashboard run e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
